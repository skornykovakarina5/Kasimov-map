<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор</title>
<style>
:root{--ink:#17302f;--river:#2d6a6a;--stone:#eceee9;--gold:#c9962b;--line:#cfd6d0}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 'PT Sans',system-ui,sans-serif;color:var(--ink);background:var(--stone)}
#login{max-width:340px;margin:20vh auto;padding:20px;background:#fff;border-radius:4px}

@media(max-width:800px){#app{grid-template-columns:1fr}}

#bar{position:sticky;top:0;z-index:20;background:var(--stone);padding:12px 0;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line)}
#savebtn{padding:12px 22px;border:0;border-radius:4px;background:var(--ink);color:#fff;font:700 17px inherit;font-family:inherit;cursor:pointer}
#savebtn.hot{background:var(--gold);color:var(--ink)}#stt{font-size:14px;color:#5b6d6c}
#vp{position:relative;height:72vh;margin-top:12px;overflow:hidden;touch-action:none;background:#dfe3dc;border-radius:4px;cursor:grab}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none}
#stage>img{display:block;width:100%;height:auto;-webkit-user-drag:none}
.zc{position:absolute;right:10px;bottom:10px;z-index:5;display:flex;flex-direction:column;gap:6px}
.zc button{width:40px;height:40px;border:0;border-radius:4px;background:var(--ink);color:#fff;font-size:20px;cursor:pointer}
.lb{position:absolute;white-space:nowrap;color:#fff;font:700 14px Georgia,'PT Serif',serif;line-height:1;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--k,1));text-shadow:-1px -1px 0 #1d2a22,1px -1px 0 #1d2a22,-1px 1px 0 #1d2a22,1px 1px 0 #1d2a22,0 0 6px #1d2a22}
.lb.place{text-transform:uppercase;letter-spacing:.14em;color:#fffbe8}.lb.street{font-family:Arial,Helvetica,sans-serif;font-weight:600}.lb.water{font-style:italic;letter-spacing:.3em;color:#e8f6ff}
.lb{cursor:grab;touch-action:none}.lb.zo{opacity:.8}.lb.sel{outline:2px dashed var(--gold);outline-offset:4px}

.rtbtn{padding:5px 9px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;font:14px inherit}.rtbtn:hover{background:#eef}.rtc{font-size:13px;display:inline-flex;align-items:center;gap:4px}.rtcol{width:30px!important;height:26px!important}.rtsel{width:auto!important;padding:4px!important;font-size:13px}
.rted{min-height:220px;padding:14px;font:17px/1.65 Georgia,serif;outline:none}
.phs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.pc{width:124px}.pc img{width:124px;height:92px;object-fit:contain;background:#eceef2;border-radius:4px;display:block}.pcb{display:flex;gap:2px;margin-top:3px}.pcb button{flex:1;padding:3px 0;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px;border-radius:3px}
.vrow{border-top:1px dashed var(--line);padding-top:6px;margin-top:8px}
.pgprev{height:70vh;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;margin:10px 0}.dz h4{margin:18px 0 6px}
.bcard{border:1px solid var(--line);border-radius:6px;margin:8px 0;background:#fafaf7}.bhead{display:flex;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap}.bhead b{flex:1;min-width:130px}.grip{cursor:grab;color:#889}.bset{padding:0 12px 12px;border-top:1px solid var(--line)}
input[type=color]{width:46px;height:34px;padding:0;border:1px solid var(--line);border-radius:3px;background:#fff}
.mk{position:absolute;transform:translate(-50%,-50%) scale(var(--k,1));min-width:26px;cursor:grab;touch-action:none}
.mk:active{cursor:grabbing}.mk img,.mk svg{display:block;width:100%;height:auto;pointer-events:none}
.mk.sel{outline:2px dashed var(--gold);outline-offset:4px}
.mk .nm{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;background:var(--ink);color:#fff;padding:1px 7px;border-radius:3px;font-size:calc(var(--nmsize,14)*1px);font-family:var(--lbfont,Georgia,serif);pointer-events:none}
.f{display:block;margin:12px 0}.f>span{display:block;font-weight:700;margin-bottom:3px}
input[type=text],textarea,select{width:100%;padding:9px;font:inherit;border:1px solid var(--line);border-radius:3px;background:#fff}
input[type=range]{width:100%}textarea{min-height:200px}
section{background:#fff;padding:14px 16px;margin:16px 0;border-radius:4px}section h3{margin:0 0 6px}
.row{display:flex;gap:6px;align-items:center;margin:6px 0}.row .u{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#5b6d6c}
.th{width:56px;height:42px;object-fit:cover;background:var(--stone)}
button.s{padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:3px;cursor:pointer;font:inherit}
button.red{color:#a33}.hint{font-size:13px;color:#5b6d6c;margin:4px 0}
.q{border:1px solid var(--line);padding:10px;margin:10px 0;border-radius:3px}
</style></head><body>
<div id="login"><h2>Вход в редактор</h2><form id="lf"><input type="text" id="pw" placeholder="Пароль" autocomplete="off"><p id="le" style="color:#a33"></p><button class="s">Войти</button></form><p class="hint">Пароль записан в файле config.txt</p></div>
<div id="app" hidden><nav id="side"></nav><main><div id="bar"><button id="savebtn">Сохранить изменения</button><span id="stt">Всё сохранено</span></div><div id="stageWrap"></div><div id="ed"></div></main></div>
<script src="page.js"></script>
<script src="admin-design.js"></script>
<script>

async function shrink(file,max,alpha){

 h('button',{class:'add',onclick:()=>{D.temples.push({id:'t'+Date.now(),name:'Новый храм',x:+pz.centerPct().x.toFixed(2),y:+pz.centerPct().y.toFixed(2),size:0,icon:'',major:false,history:'',albums:[],playlists:[],game:{type:'none',url:'',questions:[]}});sel=D.temples.length-1;mark();side();drawStage();ed()}},'+ Добавить храм'),
 h('button',{class:sel===-2?'on':'',onclick:()=>{sel=-2;selL=-1;side();updSel();drawStage();ed()}},'Аа Надписи на карте ('+(D.labels||[]).length+')'),
 h('a',{href:'index.html',target:'_blank'},'Открыть сайт ↗'))}

 return{fit,zi:()=>center(1.5),zo:()=>center(1/1.5),centerPct:()=>({x:(vp.clientWidth/2-x)/s/st.offsetWidth*100,y:(vp.clientHeight/2-y)/s/st.offsetHeight*100})}}
let pz,labs=[],selL=-1;

 const vp=h('div',{id:'vp'},st,h('div',{class:'zc'},h('button',{onclick:()=>pz.zi(),title:'Приблизить'},'+'),h('button',{onclick:()=>pz.zo(),title:'Отдалить'},'−'),h('button',{onclick:()=>pz.fit(),title:'Вся карта'},'⤢')));

 st.querySelectorAll('.mk,.lb').forEach(m=>m.remove());mks=[];labs=[];
 (D.labels||[]).forEach((l,i)=>{const b=h('div',{class:'lb '+(l.style||'poi')+(l.zin?' zo':'')+(sel===-2&&i===selL?' sel':'')},l.text);
  const ff=l.font||D.labelFont;b.style.cssText=`left:${l.x}%;top:${l.y}%;font-size:${(l.size||14)*(D.labelScale||100)/100}px;${ff?'font-family:'+PG.fontStack(ff)+';':''}--r:${l.rot||0}deg`;let drag=false;

   t.x=+Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100)).toFixed(2);t.y=+Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100)).toFixed(2);
   b.style.left=t.x+'%';b.style.top=t.y+'%';mark()};

function inp(o,k){const i=h('input',{type:'text'});i.value=o[k]??'';i.oninput=()=>{o[k]=i.value;mark()};return i}

    h('button',{class:'s red',onclick:()=>{if(confirm('Удалить надпись «'+L.text+'»?')){D.labels.splice(selL,1);selL=-1;mark();side();drawStage();ed()}}},'Удалить надпись')))}

 if(sel<0){const bgi=inp(D,'background');bgi.addEventListener('change',drawStage);E.append(h('h2',{},'Настройки сайта'),fld('Название сайта',inp(D,'siteTitle')),fld('Файл карты (например map_kasimov_real.webp)',bgi),globalFontsBox(),
  h('section',{},h('h3',{},'Фотография карты'),h('p',{class:'hint'},'Это фон главной страницы. Лучше широкая картинка (jpg, png или webp).'),pick('image/*',false,u=>{D.background=u;drawStage();mark()},5000)));return}
